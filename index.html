.sk{position:relative}

/* ===== أشكال الواجهة الرئيسية ===== */
.hmh{position:relative;display:flex;align-items:flex-end;gap:12px;min-height:170px;border-radius:28px;overflow:hidden;padding:16px;color:#fff;cursor:pointer;background:var(--accent)}
.hmh .hmhv{position:absolute;inset:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:4rem;opacity:.9}
.hmh::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.62),transparent 65%)}
.hmhi{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:right}
.hmhi b{font-size:1.5rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hmhi small{opacity:.85}
.hmh .pbtn{position:relative;z-index:1}
.hmbar{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.3);margin-top:8px}.hmbar i{display:block;height:100%;border-radius:2px;background:#fff}
.hmh.tall{min-height:300px}
.hmg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.hmt{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:96px;padding:12px;border-radius:20px;text-align:right;color:var(--ink);cursor:pointer;overflow:hidden}
.hmt b{font-size:1.02rem;font-weight:600}.hmt small{color:var(--mute)}
.hmt .hmtv{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.55}
.hmt b,.hmt small{position:relative}
.hmt.nw{align-items:center;justify-content:center;border:2px dashed var(--line);background:transparent;color:var(--accent)}
.hmm{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.hmmi{background:none;border:0;text-align:right;font-size:2.6rem;font-weight:700;line-height:1.25;color:var(--mute2);cursor:pointer;padding:0;font-family:inherit}
.hmmi.on{color:var(--ink)}.hmmi small{display:block;font-size:.8rem;font-weight:400;color:var(--mute)}
.hmc{margin-top:12px}
.hmb{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:92px;gap:10px;margin-top:14px}
.hmb .big{grid-row:span 2;color:#fff;background:var(--accent)}.hmb .wide{grid-column:span 2}
.hmb .hmt{min-height:0}
.hmf{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;direction:ltr;padding:12px 0 0;margin:0 -18px;scrollbar-width:none}
.hmf::-webkit-scrollbar{display:none}
.hmf:before,.hmf:after{content:"";flex:0 0 20%}
.hmfi{flex:0 0 60%;aspect-ratio:.82;scroll-snap-align:center;border-radius:28px;background-size:cover;background-position:center;display:flex;align-items:flex-end;color:#fff;font-weight:600;padding:14px;cursor:pointer;transition:transform .2s;margin:0 -4%;position:relative;overflow:hidden;font-size:1.2rem;text-align:left}
.hmfi span{position:relative;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.hmmood{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.hmmood button{display:flex;align-items:center;justify-content:space-between;height:74px;padding:0 20px;border:0;border-radius:24px;font-size:1.25rem;font-weight:600;cursor:pointer;font-family:inherit}
.hmmood small{font-weight:400;font-size:.85rem}
.hmd{position:relative;width:min(86vw,340px);aspect-ratio:1;margin:16px auto 8px}
.hmd .disc{position:absolute;inset:18%;border-radius:50%;background:var(--accent) center/cover;border:10px solid rgba(128,128,128,.25);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;animation:hmspin 14s linear infinite}
.hmd .disc i{width:14%;aspect-ratio:1;border-radius:50%;background:var(--lbg,#111);box-shadow:0 0 0 3px rgba(128,128,128,.4)}
.hmd .moon{position:absolute;width:20%;aspect-ratio:1;margin:-10% 0 0 -10%;border-radius:50%;background:var(--accent) center/cover;border:0;color:#fff;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
@keyframes hmspin{to{transform:rotate(360deg)}}
.hmcap{text-align:center;color:var(--mute);margin:0 0 4px}
.hmlib{margin-top:14px}.hmlib .hh{margin-bottom:12px}
.hmo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px}

function ss(a,i){return(a[i]<<21)|(a[i+1]<<14)|(a[i+2]<<7)|a[i+3]}
function u32(a,i){return((a[i]<<24)|(a[i+1]<<16)|(a[i+2]<<8)|a[i+3])>>>0}
function str(a,i,n){return String.fromCharCode.apply(0,a.subarray(i,i+n))}
async function cover(f){
 try{
  var h=new Uint8Array(await f.slice(0,10).arrayBuffer());
  if(str(h,0,3)!=="ID3"||h[3]<3)return null;
  var t=new Uint8Array(await f.slice(10,10+ss(h,6)).arrayBuffer()),p=0;
  while(p+10<=t.length&&t[p]){
   var id=str(t,p,4),sz=h[3]==4?ss(t,p+4):u32(t,p+4);
   if(id==="APIC"){
    var q=p+10,e=t[q++];while(t[q++]);q++;
    if(e==1||e==2){while(q<t.length&&!(t[q]==0&&t[q+1]==0))q+=2;q+=2}else{while(t[q++]);}
    var img=t.slice(q,p+10+sz);if(img.length<100)return null;
    return URL.createObjectURL(new Blob([img],{type:img[0]==0x89?"image/png":"image/jpeg"}));
   }
   p+=10+sz;
  }
 }catch(e){}
 return null;
}
